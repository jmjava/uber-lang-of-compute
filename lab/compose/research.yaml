# Research-test TSDB + optional Kafka bus (no Kind). From repo root:
#   docker compose -f lab/compose/research.yaml up --build
#   docker compose -f lab/compose/research.yaml up -d redpanda
#   KAFKA_BROKERS=127.0.0.1:19092 go test ./controller/pkg/cdc -run TestKafkaCDCRoundTrip
name: kbl-research
services:
  tsdb:
    build:
      context: ../..
      dockerfile: controller/docker/kbl-tsdb/Dockerfile
    ports:
      - "9090:9090"
    command: ["--addr=:9090", "--data-dir=/var/kbl/tsdb"]
    volumes:
      - tsdb-data:/var/kbl/tsdb
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
volumes:
  tsdb-data:
  redpanda-data:

# Single-context Volcano wheel for compact (1-worker) Kind clusters.
# Catalog: Snapshot/julia-curve-2025-04-15 + julia-* Dominos; runner image from julia-finance-universe.
apiVersion: kbl.io/v1alpha1
kind: ComputeWheel
metadata:
  name: julia-finance-wheel
  namespace: default
  labels:
    kbl.io/volcano-demo: "true"
    kbl.io/julia-demo: "true"
spec:
  contexts:
    - default-context
  timeSliceInterval: 24h
  maxRotations: 1
  volcanoQueue: kbl-lab
  nodeSelector:
    kbl.io/lab-role: compute
  schedule:
    startTimeSlice: "2025-04-15T00:00:00Z"
  workflowTemplate:
    snapshotRef: julia-curve-2025-04-15
    dominoRefs:
      - julia-identity
      - julia-interpolate
      - julia-greeks
    execution:
      chain: [julia-identity, julia-interpolate, julia-greeks]
      deterministic: true
      runtime: volcano-init
    provisioning:
      storePath: http://kbl-tsdb.kbl-system.svc.cluster.local:9090
      nodeLocal: true
    routing:
      universe: julia-finance-universe

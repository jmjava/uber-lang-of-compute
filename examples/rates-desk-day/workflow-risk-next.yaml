apiVersion: kbl.io/v1alpha1
kind: Workflow
metadata:
  name: rates-risk-ny-tplus1
  labels:
    kbl.io/domain: finance
    kbl.io/desk: risk
    kbl.io/partition-asset_class: rates
spec:
  snapshot:
    apiVersion: kbl.io/v1alpha1
    kind: Snapshot
    metadata:
      name: ust-par-2025-04-16
    spec:
      timeSlice: "2025-04-16T00:00:00Z"
      source:
        inline:
          as_of: "2025-04-16T00:00:00Z"
          currency: USD
          curve: UST_PAR
          instruments:
            - instrument_id: US1Y
              rate: 4.64
              maturity: "2026-04-16"
            - instrument_id: US2Y
              rate: 4.72
              maturity: "2027-04-16"
            - instrument_id: US3Y
              rate: 4.58
              maturity: "2028-04-16"
            - instrument_id: US5Y
              rate: 4.46
              maturity: "2030-04-16"
            - instrument_id: US7Y
              rate: 4.38
              maturity: "2032-04-16"
            - instrument_id: US10Y
              rate: 4.31
              maturity: "2035-04-16"
            - instrument_id: US20Y
              rate: 4.48
              maturity: "2045-04-16"
            - instrument_id: US30Y
              rate: 4.58
              maturity: "2055-04-16"
      sealed: true

  dominos:
    - apiVersion: kbl.io/v1alpha1
      kind: Domino
      metadata:
        name: load-curve-data
      spec:
        snapshotRef: ust-par-2025-04-16
        command: builtin:identity
        inputs: []

    - apiVersion: kbl.io/v1alpha1
      kind: Domino
      metadata:
        name: interpolate-curve
      spec:
        snapshotRef: ust-par-2025-04-16
        command: builtin:interpolate
        dependsOn: [load-curve-data]
        inputs:
          - fromDomino: load-curve-data

    - apiVersion: kbl.io/v1alpha1
      kind: Domino
      metadata:
        name: compute-risk
      spec:
        snapshotRef: ust-par-2025-04-16
        command: builtin:risk-dv01
        dependsOn: [interpolate-curve]
        inputs:
          - fromDomino: interpolate-curve

  execution:
    chain: [load-curve-data, interpolate-curve, compute-risk]
    deterministic: true

  provisioning:
    storePath: /tmp/kbl-rates-desk/ny.db
    nodeLocal: true

  routing:
    universe: rates-universe
    computeContextRef: ny-rates
    multiverseRef: finance-multiverse

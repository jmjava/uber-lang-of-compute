apiVersion: kbl.io/v1alpha1
kind: Workflow
metadata:
  name: rates-mid-ln
  labels:
    kbl.io/domain: finance
    kbl.io/desk: mid
    kbl.io/partition-asset_class: rates
spec:
  snapshot:
    apiVersion: kbl.io/v1alpha1
    kind: Snapshot
    metadata:
      name: ust-par-2025-04-15
    spec:
      timeSlice: "2025-04-15T00:00:00Z"
      source:
        inline:
          as_of: "2025-04-15T00:00:00Z"
          currency: USD
          curve: UST_PAR
          instruments:
            - instrument_id: US1Y
              rate: 4.70
              maturity: "2026-04-15"
            - instrument_id: US2Y
              rate: 4.80
              maturity: "2027-04-15"
            - instrument_id: US3Y
              rate: 4.62
              maturity: "2028-04-15"
            - instrument_id: US5Y
              rate: 4.45
              maturity: "2030-04-15"
            - instrument_id: US7Y
              rate: 4.35
              maturity: "2032-04-15"
            - instrument_id: US10Y
              rate: 4.25
              maturity: "2035-04-15"
            - instrument_id: US20Y
              rate: 4.40
              maturity: "2045-04-15"
            - instrument_id: US30Y
              rate: 4.48
              maturity: "2055-04-15"
      sealed: true

  # Same load/interpolate names as the NY risk book so London quoting
  # reuses the sealed sub-curve instead of recomputing it.
  dominos:
    - apiVersion: kbl.io/v1alpha1
      kind: Domino
      metadata:
        name: load-curve-data
      spec:
        snapshotRef: ust-par-2025-04-15
        command: builtin:identity
        inputs: []

    - apiVersion: kbl.io/v1alpha1
      kind: Domino
      metadata:
        name: interpolate-curve
      spec:
        snapshotRef: ust-par-2025-04-15
        command: builtin:interpolate
        dependsOn: [load-curve-data]
        inputs:
          - fromDomino: load-curve-data

  execution:
    chain: [load-curve-data, interpolate-curve]
    deterministic: true

  provisioning:
    storePath: /tmp/kbl-rates-desk/ny.db
    nodeLocal: true

  routing:
    universe: rates-universe
    computeContextRef: ln-rates
    multiverseRef: finance-multiverse

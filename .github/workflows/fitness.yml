name: Fitness function

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  language-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: controller/go.sum

      - name: Language core import boundary
        run: make fitness

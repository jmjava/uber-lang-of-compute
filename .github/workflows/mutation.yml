# Mutation ratchet for one package. go-mutesting runs in this job only.

name: Mutation ratchet

on:
  pull_request:
  push:
    branches:
      - main
      - verify/uloc-ratchets

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Install go-mutesting
        run: |
          go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb
          mkdir -p "$HOME/bin"
          install "$(go env GOPATH)/bin/go-mutesting" "$HOME/bin/go-mutesting"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          test -x "$HOME/bin/go-mutesting"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: controller/go.sum

      - name: CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Mutation score proving test
        run: ./scripts/mutation-score-test.sh

      - name: Mutation score for controller/pkg/hash
        run: ./scripts/run-mutation.sh

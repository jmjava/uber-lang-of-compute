name: Maintainability ratchets

on:
  pull_request:
  push:
    branches:
      - main
      - verify/uloc-fitness-boundary

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Install go-mutesting
        run: |
          go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb
          mkdir -p "$HOME/bin"
          cp "$(go env GOPATH)/bin/go-mutesting" "$HOME/bin/go-mutesting"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: controller/go.sum

      - name: CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Install lint and complexity tools
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Ratchets
        run: make ratchet
